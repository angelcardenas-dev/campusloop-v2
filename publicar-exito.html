<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusLoop - Artículo Publicado</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="activate-page-bg matias-page">

    <!-- HEADER GLOBAL -->
    <div class="home-header-band">
        <header class="home-header home-screen-header page-width">
            <a class="brand" href="index.html">
                <img src="assets/icons/campus-32.svg" width="32" height="32" alt="">CampusLoop
            </a>
            <nav class="home-nav home-screen-nav">
                <a href="inicio.html">Inicio</a>
                <a href="explorar.html">Explorar</a>
                <a href="#" class="active">Publicar</a>
                <a href="#">Reservas</a>
            </nav>
            <div class="home-search">
                <img src="assets/icons/explorar-20.svg" width="20" alt="">
                <input type="search" placeholder="Buscar artículos..." readonly>
            </div>
            <button class="home-notifications home-icon-control" type="button">
                <img src="assets/icons/campana.svg" width="24" height="24" alt="Notificaciones">
            </button>
            <a class="home-account-link">
                <img class="avatar" src="assets/images/avatares/maria-lopez.jpg" width="40" height="40" alt="Perfil">
            </a>
        </header>
    </div>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="publish-container page-width">
        
        <div class="publish-header">
            <h1>Publicar artículo</h1>
            <p>Completa los datos de tu artículo. Esta sección requiere un perfil vendedor activo.</p>
        </div>

        <div class="publish-success-wrapper">
            <div class="publish-success-area">
                <div class="success-alert">
                    <strong>Artículo publicado</strong>
                    <span>Tu publicación ya está disponible para la comunidad.</span>
                </div>
                
                <a href="explorar.html" class="btn-primary btn-inline">Ver mis publicaciones</a>
            </div>
        </div>
        
    </main>

    <!-- BARRA DE NAVEGACIÓN MÓVIL -->
    <nav class="home-bottom home-screen-bottom" aria-label="Navegación móvil">
        <a href="inicio.html"><img src="assets/icons/campus.svg" width="24" height="24" alt=""><span>Inicio</span></a>
        <a href="explorar.html"><img src="assets/icons/explorar.svg" width="24" height="24" alt=""><span>Explorar</span></a>
        <a href="#" aria-current="page"><img src="assets/icons/publicar.svg" width="24" height="24" alt=""><span>Publicar</span></a>
        <a href="#"><img src="assets/icons/reservas.svg" width="24" height="24" alt=""><span>Reservas</span></a>
    </nav>
</body>
</html>
